# Reverse proxy nginx para o ENADE Cadastro em Lote.
# Termina TLS, aplica rate limiting e encaminha para o container `web`.
#
# Coloque os certificados em ./deploy/certs/ (montados em /etc/nginx/certs):
#   - fullchain.pem
#   - privkey.pem
# Com Let's Encrypt (certbot), aponte para os arquivos gerados.

# Zona de rate limit por IP (ajuste conforme necessário).
limit_req_zone $binary_remote_addr zone=enade_limit:10m rate=10r/s;

# Redireciona HTTP -> HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;   # troque pelo seu domínio (ex.: enade.suainstituicao.br)

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Limite de upload alinhado ao MAX_UPLOAD_MB do app (16 MB + margem).
    client_max_body_size 20m;

    # Cabeçalhos de segurança (o app também os envia; aqui reforça na borda).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=enade_limit burst=20 nodelay;

        proxy_pass http://web:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
